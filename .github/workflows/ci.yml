name: foundation-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-foundation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"

      - name: Check the vendored owner package before installing it
        run: |
          echo "771a9f565ea9df87a4c08e6e6d5ede422d2a5926182a95be082dc8ed7b8c4c43  vendor/shared-contracts/jevelopers-shared-contracts-0.9.7.tgz" | sha256sum -c -
          tar -xzOf vendor/shared-contracts/jevelopers-shared-contracts-0.9.7.tgz package/package.json | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));const l=["preinstall","install","postinstall","prepare","prepublish","prepublishOnly","prepack","postpack"].filter((k)=>p.scripts&&p.scripts[k]!==undefined);if(l.length||p.dependencies){console.error("owner package has lifecycle scripts or dependencies");process.exit(1)}'
          node -e 'const l=JSON.parse(require("fs").readFileSync("package-lock.json","utf8")).packages["node_modules/@jevelopers/shared-contracts"];if(l.resolved!=="file:vendor/shared-contracts/jevelopers-shared-contracts-0.9.7.tgz"||l.integrity!=="sha512-P462b8thg20g5RknBzdDL5mfxpXF+kpodLPCGrTe3kmKXrw9YZ21x3E/PuGEp0aEOGoiBZlq5JB4Pktq+2lBPg=="){console.error("lock entry differs from the pinned owner archive");process.exit(1)}'

      - name: Install locked dependencies
        run: npm ci

      - name: Build and run local contract tests
        run: npm test

      - name: Verify the simulated contract wrapper
        run: npm run verify:contract

      - name: Verify the simulated catalog wrapper
        run: npm run verify:catalog

      - name: Verify the offline provider matrix policy
        run: npm run verify:provider-matrix

      - name: Verify private local security policy fixtures
        run: npm run verify:security

      - name: Verify the simulated metering and outbox suite
        run: npm run verify:metering

      - name: Verify the deterministic simulated runtime
        run: npm run verify:mock

      - name: Verify private offline quote fixtures
        run: npm run verify:quote

      - name: Verify private local durable attempt fixtures
        run: npm run verify:attempt-store

      - name: Verify private offline comparison fixtures
        run: npm run verify:comparison

      - name: Verify private offline status fixtures
        run: npm run verify:status

      - name: Verify private simulated Product Details decoder fixtures
        run: npm run verify:prodigi-product-details

      - name: Verify private bounded PNG byte inspection fixtures
        run: npm run verify:png-inspection

      - name: Verify the simulated order authorization consumer and dispatch revalidation
        run: npm run verify:order-authorization

      - name: Verify the ProductionBundle consumer over the owner package and the real corpus bytes
        run: npm run verify:package
